# ASOkai pipeline configuration
# Used by ASOkai pipeline steps and CLI entry points

datadir: ./data

validation:
  existing_outputs: signature

genome:
  assembly_id: GRCh38
  ensembl_release: 114
  source: ensembl
  species: Homo_sapiens

target:
  target_id: ENSG00000133703  # KRAS
  k: 16
  region: pre-mrna  # exonic | pre-mrna | transcriptomic

antisense:
  modality: aso
  mechanism: rnase-h1
  design:
    type: gapmer
    left_wing_length: 3
    gap_length: 10
    right_wing_length: 3

resources:
  default:
    n_processes: 1
    memory_mb: 4096
  build-genome-kmer-index:
    n_processes: 4
  intrinsic-features:
    n_processes: 4
    memory_mb: 4096
