# yaml-language-server: $schema=./src/ASOkai/_pipeline/config.schema.yaml
# Copy this file to config.yaml and adjust the values for your run.

datadir: ./data

parameters:
  genome:
    assembly: GRCh38
    release: 114
    source: ensembl
    species: Homo_sapiens
  target:
    # Set exactly one of target_id or target_name.
    target_id: ENSG00000133703
    # target_name: KRAS
    k: 16
    region: pre-mrna  # exonic | pre-mrna | transcriptomic
  antisense:
    modality: aso
    mechanism: rnase-h1
    design:
      type: gapmer
      left_wing_length: 3
      gap_length: 10
      right_wing_length: 3
    # For unmodified DNA ASOs, use design: {type: unmodified} instead.

# How to check generated outputs before reusing them. "signature" is the default;
# "contract" fully validates each existing output instead.
validation:
  existing_outputs: signature

resources:
  default:
    n_threads: 1
    memory_mb: 4096
  intrinsic-features:
    n_threads: 4

# Select ordered runs here and invoke `ASOkai run --configfile config.yaml`.
# A run needs an ID only if another run refers to it. Task outputs are the
# public names declared by the task; child IDs stay inside the task.
# runs:
#   - step: intrinsic-features
#     inputs:
#       target_gene:
#         from: run.gene.target_gene
#   - task: instantiate-target-gene
#     id: gene
#   - step: create-target-gene
#     parameters:
#       region: exonic
# An existing file can be selected instead with:
#       target_gene:
#         path: /path/to/target_gene.json
