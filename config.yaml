# ASOkai pipeline configuration
# Used by ASOkai pipeline steps and CLI entry points

datadir: ./data

genome:
  assembly_id: GRCh38
  ensembl_release: 114
  source: ensembl
  species: Homo_sapiens

target:
  target_id: ENSG00000133703  # KRAS
  k: 16
  region: pre-mrna  # exonic | pre-mrna | transcriptomic

antisense:
  modality: aso
  mechanism: rnase-h1
  chemistry:
    type: gapmer
    layout: "3-10-3"

resources:
  default:
    n_processes: 1
    memory_mb: 4096
  download-genome:
    n_processes: 1
    memory_mb: 4096
  create-target-gene:
    n_processes: 1
    memory_mb: 4096
  generate-antisense-candidates:
    n_processes: 1
    memory_mb: 4096
  intrinsic-features:
    n_processes: 4
    memory_mb: 4096
