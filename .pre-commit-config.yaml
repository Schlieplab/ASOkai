repos:
  - repo: local
    hooks:
      - id: validate-asokai-contributions
        name: Validate ASOkai contributor and plugin contracts
        entry: python -m pytest -q tests/contributor/test_analysis_steps.py tests/unit/test_plugins.py
        language: system
        pass_filenames: false
        files: '^(src/ASOkai/|examples/contributor_steps/|examples/plugins/|examples/config\.example\.yaml$|tests/contributor/test_analysis_steps\.py$|tests/unit/test_plugins\.py$|pyproject\.toml$|\.pre-commit-config\.yaml$)'
