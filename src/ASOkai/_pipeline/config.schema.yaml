$schema: https://json-schema.org/draft/2020-12/schema
title: ASOkai configuration
type: object
additionalProperties: true
required:
  - datadir
properties:
  datadir:
    type: string
    minLength: 1
    description: Directory that receives ASOkai data.

  genome:
    type: object
    additionalProperties: false
    properties:
      assembly_id:
        type: string
        minLength: 1
        description: Genome assembly ID, such as GRCh38.
      ensembl_release:
        type: integer
        minimum: 1
        description: Ensembl release number.
      source:
        const: ensembl
        default: ensembl
        description: Genome data source.
      species:
        type: string
        minLength: 1
        description: Ensembl species name, such as Homo_sapiens.
      dna_path:
        type:
          - string
          - "null"
        minLength: 1
        description: Optional genomic DNA FASTA override.
      cdna_path:
        type:
          - string
          - "null"
        minLength: 1
        description: Optional cDNA FASTA override.
      annotation_path:
        type:
          - string
          - "null"
        minLength: 1
        description: Optional genome annotation override.
      db_path:
        type:
          - string
          - "null"
        minLength: 1
        description: Optional annotation database override.

  target:
    type: object
    additionalProperties: false
    properties:
      target_id:
        type:
          - string
          - "null"
        minLength: 1
        description: Ensembl gene ID; use this or target_name, but not both.
      target_name:
        type:
          - string
          - "null"
        minLength: 1
        description: Gene name; use this or target_id, but not both.
      k:
        type: integer
        minimum: 1
        description: Antisense oligonucleotide length.
      region:
        enum:
          - exonic_only
          - pre-mrna
          - transcriptomic
        description: Target region type.
      target_gene_path:
        type:
          - string
          - "null"
        minLength: 1
        description: Optional serialized target-gene override.
    allOf:
      - oneOf:
          - required:
              - target_id
            properties:
              target_id:
                type: string
          - required:
              - target_name
            properties:
              target_name:
                type: string
        x-error-message: >-
          exactly one of these config values is required:
          target.target_id, target.target_name

  antisense:
    type: object
    additionalProperties: false
    properties:
      modality:
        type: string
        minLength: 1
        description: Antisense therapeutic modality.
      mechanism:
        type: string
        minLength: 1
        description: Therapeutic mechanism of action.
      chemistry:
        type: object
        additionalProperties: false
        properties:
          type:
            type: string
            minLength: 1
            description: Antisense oligonucleotide chemistry.
          layout:
            type: string
            pattern: ^[1-9][0-9]*-[1-9][0-9]*-[1-9][0-9]*$
            description: >-
              Positive left-wing, gap, and right-wing lengths, such as
              3-10-3. The three lengths must sum to target.k.

  resources:
    type: object
    properties:
      default:
        type: object
        additionalProperties: false
        properties:
          n_processes:
            type: integer
            minimum: 1
            description: Default number of processes for every step.
          memory_mb:
            type: integer
            minimum: 1
            description: Default memory in mebibytes for every step.
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        n_processes:
          type: integer
          minimum: 1
          description: Number of processes allocated to this step.
        memory_mb:
          type: integer
          minimum: 1
          description: Memory in mebibytes allocated to this step.
