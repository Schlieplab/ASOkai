repos:
  - repo: local
    hooks:
      - id: check-python-types
        name: Check Python types
        entry: python -m pyright
        language: system
        pass_filenames: false
        files: '^(src/ASOkai/|docs/source/_extensions/|examples/contributor_steps/|examples/plugins/|pyproject\.toml$|\.pre-commit-config\.yaml$)'
      - id: validate-asokai-contributor-steps
        name: Validate ASOkai contributor step contracts
        entry: python -m pytest -q tests/contributor/test_analysis_steps.py
        language: system
        pass_filenames: false
        files: '^(src/ASOkai/|examples/contributor_steps/|examples/config\.example\.yaml$|tests/contributor/test_analysis_steps\.py$|pyproject\.toml$|\.pre-commit-config\.yaml$)'
      - id: validate-asokai-plugins
        name: Validate ASOkai plugin contracts
        entry: python -m pytest -q tests/plugins
        language: system
        pass_filenames: false
        files: '^(src/ASOkai/|examples/plugins/|tests/plugins/|pyproject\.toml$|\.pre-commit-config\.yaml$)'
