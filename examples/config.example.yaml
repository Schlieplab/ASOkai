# yaml-language-server: $schema=./src/ASOkai/_pipeline/config.schema.yaml
# Copy this file to config.yaml and adjust the values for your run.

datadir: ./data

# Use "contract" to bypass output receipts and fully validate every existing
# generated output before reusing it.
validation:
  existing_outputs: signature

genome:
  assembly_id: GRCh38
  ensembl_release: 114
  source: ensembl
  species: Homo_sapiens

target:
  # Set exactly one of target_id or target_name.
  target_id: ENSG00000133703
  # target_name: KRAS
  k: 16
  region: pre-mrna  # exonic | pre-mrna | transcriptomic

# Any file input can use an existing file instead of its producer output.
# steps:
#   intrinsic-features:
#     inputs:
#       target_gene:
#         path_override: /path/to/target_gene.json
#
# If that FileInput explicitly exposes producer parameters, it can instead
# request a separate producer run. The allowed names come from the input's
# configurable_parameters declaration. Use parameters or path_override,
# never both.
# steps:
#   consumer-step:
#     inputs:
#       input_name:
#         parameters:
#           producer_parameter: alternate-value

antisense:
  modality: aso
  mechanism: rnase-h1
  design:
    type: gapmer
    left_wing_length: 3
    gap_length: 10
    right_wing_length: 3
  # To generate unmodified DNA ASOs instead, use only:
  # design:
  #   type: unmodified

resources:
  default:
    n_threads: 1
    memory_mb: 4096
  intrinsic-features:
    n_threads: 4

# Select ordered runs in this file, then use `ASOkai run --configfile config.yaml`.
# Step parameters override the shared values above for that run only.
# Do not combine runs with --step, --task, or --workflow.
# runs:
#   - step: create-target-gene
#     id: gene
#   - step: intrinsic-features
#     inputs:
#       target_gene:
#         run_id: gene
#         output: target_gene
#   - step: create-target-gene
#     parameters:
#       region: exonic
#   - task: instantiate-target-gene
# To use an existing file instead, replace an input's run/output pair with:
#         path: /path/to/target_gene.json
